# Matches httpd.conf in the repo root.
# Hide Apache/module version details from clients (error pages, Server
# header) and disable TRACE (mitigates cross-site tracing/XST attacks).
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Safe response-header defaults. Unset the normal response-table value first
# so an application-provided header cannot produce conflicting duplicates when
# the policy is written to Apache's always table (which also covers errors).
<IfModule mod_headers.c>
    Header onsuccess unset X-Content-Type-Options
    Header always set X-Content-Type-Options "nosniff"

    Header onsuccess unset Referrer-Policy
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    Header onsuccess unset X-Powered-By
    Header always unset X-Powered-By

    # Site-specific policies are intentionally disabled. Review each policy
    # against the application and deployment before enabling it.
    # Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'"
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    # Header always set X-Frame-Options "SAMEORIGIN"
    # Header always set Permissions-Policy "camera=(), geolocation=(), microphone=()"
    # Header always set Access-Control-Allow-Origin "https://www.example.com"
</IfModule>
