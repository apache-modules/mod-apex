; Validated opcache config for mod_apex (see README.md#opcache-support and
; /memories/repo/mod_apex-debug-notes.md). zend_extension=opcache.so is
; required for the accelerator to load at all; php_embed_module.name is
; overridden to "apache2handler" in mod_apex.c's apex_post_config() so
; OPcache's internal SAPI allowlist accepts it -- without that override this
; ini has no effect and opcache_get_status() returns false.
zend_extension=opcache.so
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Skips a per-request fstat() staleness check on every included file.
; Restart/reload Apache (or call opcache_reset()) after deploying new PHP
; code when this is 0, since changes are not picked up automatically.
opcache.validate_timestamps=0
