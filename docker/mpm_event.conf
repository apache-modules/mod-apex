# mpm_event tuning for mod_apex's persistent per-thread PHP runtime (see
# httpd.conf in the repo root, which this mirrors). Adjust for your container's
# CPU/memory limits -- these values assume a multi-core host; scale down
# ServerLimit/ThreadsPerChild/MaxRequestWorkers for small containers, and keep
# MaxSpareThreads == ServerLimit*ThreadsPerChild proportionally.
<IfModule mpm_event_module>
    StartServers 4
    ServerLimit 32
    ThreadLimit 64
    ThreadsPerChild 64
    MinSpareThreads 128
    # Match ServerLimit*ThreadsPerChild -- see httpd.conf comment for why.
    MaxSpareThreads 2048
    MaxRequestWorkers 2048
    MaxConnectionsPerChild 0
</IfModule>
