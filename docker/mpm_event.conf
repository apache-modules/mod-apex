# mpm_event tuning for mod_apex's persistent per-thread PHP runtime (see
# httpd.conf in the repo root, which this mirrors). Adjust for your container's
# CPU/memory limits -- these values assume a multi-core host; scale down
# ServerLimit/ThreadsPerChild/MaxRequestWorkers for small containers.
<IfModule mpm_event_module>
    StartServers 4
    ServerLimit 32
    ThreadLimit 64
    ThreadsPerChild 64
    MinSpareThreads 128
    MaxSpareThreads 256
    MaxRequestWorkers 2048
    MaxConnectionsPerChild 0
</IfModule>
