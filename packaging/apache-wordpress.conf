# PHP Apex safe fallback. Package installation replaces this with an
# automatically sized profile using the detected CPU and memory limits.
KeepAlive Off
MaxKeepAliveRequests 10000
KeepAliveTimeout 1

<IfModule mpm_event_module>
StartServers 1
ServerLimit 1
ThreadLimit 4
ThreadsPerChild 4
MinSpareThreads 4
MaxSpareThreads 4
MaxRequestWorkers 4
MaxConnectionsPerChild 0
</IfModule>
