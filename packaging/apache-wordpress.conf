# PHP Apex WordPress profile
# Conservative baseline for a 2-CPU, 2-GB single-application server.
KeepAlive Off
MaxKeepAliveRequests 10000
KeepAliveTimeout 1

<IfModule mpm_event_module>
StartServers 1
ServerLimit 1
ThreadLimit 64
ThreadsPerChild 64
MinSpareThreads 64
MaxSpareThreads 64
MaxRequestWorkers 64
MaxConnectionsPerChild 0
</IfModule>
