# PHP Apex WordPress profile
# Validated with mixed anonymous and authenticated WordPress traffic.
KeepAlive On
MaxKeepAliveRequests 10000
KeepAliveTimeout 1

<IfModule mpm_event_module>
StartServers 2
ServerLimit 2
ThreadLimit 64
ThreadsPerChild 64
MinSpareThreads 64
MaxSpareThreads 128
MaxRequestWorkers 128
MaxConnectionsPerChild 1000
</IfModule>
