# Use the event MPM (threads = persistent PHP interpreter pool size)
LoadModule mpm_event_module modules/mod_mpm_event.so
<IfModule mpm_event_module>
    StartServers 1
    ServerLimit 1
    ThreadLimit 4
    ThreadsPerChild 4
    MinSpareThreads 4
    # Match ServerLimit*ThreadsPerChild so spare threads can never exceed the
    # max and Apache never scale-down-kills an idle child; if a killed child
    # still holds pooled mod_proxy/mod_proxy_fcgi backend connections (e.g. a
    # parallel FPM comparison route), that has been observed to crash stock
    # Apache's mod_proxy (ap_proxy_acquire_connection reslist-cleanup NULL deref).
    MaxSpareThreads 4
    MaxRequestWorkers 4
    MaxConnectionsPerChild 0
</IfModule>

KeepAlive Off
MaxKeepAliveRequests 10000
KeepAliveTimeout 1

# Security hardening (recommended for production)
# Hide Apache/module version details from clients (error pages, Server
# header) and disable TRACE (mitigates cross-site tracing/XST attacks).
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Load mod_apex
LoadModule apex_module modules/mod_apex.so

# Log level (optional)
<IfModule apex_module>
    LogLevel info

    # Include diagnostic detail in mod_apex error pages. Default: Off.
    # Keep this Off in production to avoid leaking internal details to
    # clients; enable only temporarily while diagnosing an issue.
    ApexVerboseErrors Off
</IfModule>

# mod_apex exposes every incoming request header to PHP as $_SERVER['HTTP_*'],
# the same as mod_php/PHP-FPM/CGI. X-Forwarded-*/X-Real-IP are therefore only
# as trustworthy as any other client-supplied header. If this Apache sits
# behind a reverse proxy/load balancer:
#   - Use mod_remoteip (not mod_apex) to correctly resolve REMOTE_ADDR from a
#     trusted proxy, e.g.:
#       LoadModule remoteip_module modules/mod_remoteip.so
#       RemoteIPHeader X-Forwarded-For
#       RemoteIPTrustedProxy 127.0.0.1
#   - Validate/strip X-Forwarded-* and X-Real-IP at the proxy/load balancer,
#     or at the application/framework layer (e.g. Symfony trusted proxies,
#     Laravel TrustProxies) rather than trusting them implicitly in PHP.

# Route .php files to our handler
<FilesMatch \.php$>
    SetHandler php-script
</FilesMatch>
